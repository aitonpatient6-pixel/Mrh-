<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer un compte — Multi Resto Hôtel</title>
<style>
:root{
  --dark:#08111f;
  --dark2:#0d1b2a;
  --teal:#14b8a6;
  --light:#5eead4;
  --gold:#f59e0b;
  --white:#f8fafc;
  --muted:#94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--white);
  background:
    radial-gradient(circle at 15% 10%,rgba(20,184,166,.18),transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(245,158,11,.13),transparent 28%),
    linear-gradient(145deg,var(--dark),var(--dark2));
}
.card{
  width:min(460px,100%);
  padding:30px;
  border:1px solid rgba(148,163,184,.18);
  border-radius:24px;
  background:rgba(15,23,42,.76);
  backdrop-filter:blur(16px);
}
.logo{
  display:block;
  width:76px;
  height:76px;
  margin:0 auto 14px;
}
h1{text-align:center;margin:0}
.subtitle{text-align:center;color:var(--muted)}
label{display:block;margin:13px 0 6px;font-weight:700}
input,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(148,163,184,.2);
  background:#0f172a;
  color:white;
  font-size:16px;
}
button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--teal),#0f766e);
  color:white;
  font-weight:800;
  font-size:16px;
}
.msg{
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  display:none;
}
.links{text-align:center;margin-top:18px}
a{color:var(--light)}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/mrh-logo.svg" alt="MRH">
  <h1>Créer un compte</h1>
  <p class="subtitle">Rejoignez Multi Resto Hôtel</p>

  <form id="registerForm">
    <label for="name">Nom</label>
    <input id="name" required autocomplete="name">

    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email">

    <label for="phone">Téléphone</label>
    <input id="phone" autocomplete="tel">

    <label for="role">Type de compte</label>
    <select id="role">
      <option value="client">Client</option>
      <option value="restaurant">Restaurant</option>
      <option value="hotel">Hôtel</option>
    </select>

    <label for="language">Langue</label>
    <select id="language">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>

    <label for="password">Mot de passe</label>
    <input id="password" type="password" minlength="6" required autocomplete="new-password">

    <button type="submit">Créer mon compte</button>
  </form>

  <div id="message" class="msg"></div>

  <div class="links">
    Déjà un compte ?
    <a href="login.html">Se connecter</a>
  </div>
</main>

<script>
const form=document.getElementById("registerForm");
const msg=document.getElementById("message");

form.addEventListener("submit",async e=>{
  e.preventDefault();
  msg.style.display="none";

  try{
    const response=await fetch("/api/auth/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:document.getElementById("name").value.trim(),
        email:document.getElementById("email").value.trim(),
        phone:document.getElementById("phone").value.trim(),
        role:document.getElementById("role").value,
        language:document.getElementById("language").value,
        password:document.getElementById("password").value
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.detail || "Création du compte impossible");
    }

    msg.textContent="Compte créé. Redirection vers la connexion...";
    msg.style.display="block";

    setTimeout(()=>location.href="login.html",800);

  }catch(error){
    msg.textContent=error.message;
    msg.style.display="block";
  }
});
</script>
</body>
</html>
