<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Resto Hôtel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
        }

        header h1 {
            margin: 0 0 12px;
        }

        main {
            width: min(100% - 24px, 1000px);
            margin: auto;
            padding: 16px 0 30px;
        }

        section {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        select,
        button {
            min-height: 44px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            padding: 8px 12px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
            border: 0;
            font-weight: bold;
            margin: 4px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .stop {
            background: #dc2626;
            color: white;
        }

        .logout {
            background: #374151;
            color: white;
        }

        .item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px;
            margin: 10px 0;
        }

        .status {
            font-weight: bold;
        }

        .empty {
            color: #6b7280;
        }

        .error {
            color: #b91c1c;
        }

        .success {
            color: #15803d;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
    </style>

<style id="mrh-design">
:root{
  --mrh-dark:#08111f;
  --mrh-dark2:#0d1b2a;
  --mrh-teal:#14b8a6;
  --mrh-light:#5eead4;
  --mrh-gold:#f59e0b;
  --mrh-text:#f8fafc;
  --mrh-muted:#94a3b8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%,rgba(20,184,166,.17),transparent 28%),
    radial-gradient(circle at 95% 8%,rgba(245,158,11,.13),transparent 25%),
    linear-gradient(145deg,var(--mrh-dark),var(--mrh-dark2)) !important;
  color:var(--mrh-text) !important;
  min-height:100vh;
}

header,
.header,
.topbar,
.navbar{
  background:rgba(8,17,31,.88) !important;
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,.09) !important;
}

button,
.btn{
  border-radius:14px !important;
  transition:.2s ease !important;
}

button:hover,
.btn:hover{
  transform:translateY(-2px);
}

input,
select,
textarea{
  background:rgba(255,255,255,.055) !important;
  color:#fff !important;
  border:1px solid rgba(255,255,255,.10) !important;
  border-radius:13px !important;
}

.card,
.restaurant,
.hotel,
.establishment,
.panel,
.box,
.subscription,
.notification{
  background:rgba(255,255,255,.045) !important;
  border:1px solid rgba(255,255,255,.09) !important;
  border-radius:22px !important;
  box-shadow:0 18px 55px rgba(0,0,0,.18) !important;
}

.mrh-logo{
  width:58px;
  height:58px;
  border-radius:16px;
  object-fit:contain;
}

.mrh-brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
}

.mrh-title{
  background:linear-gradient(
    90deg,
    #5eead4,
    #14b8a6,
    #fbbf24
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.mrh-primary{
  background:linear-gradient(
    135deg,
    #5eead4,
    #14b8a6
  ) !important;
  color:#06201d !important;
  border:0 !important;
  font-weight:800;
}

.mrh-gold{
  background:linear-gradient(
    135deg,
    #fbbf24,
    #f59e0b
  ) !important;
  color:#261500 !important;
  border:0 !important;
  font-weight:800;
}
</style>

</head>

<body>

<header>
    <h1 id="appName">Multi Resto Hôtel</h1>

    <label for="language">Langue</label>
    <select id="language">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="ar">العربية</option>
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="tr">Türkçe</option>
        <option value="ha">Hausa</option>
        <option value="yo">Yorùbá</option>
        <option value="ig">Igbo</option>
        <option value="sw">Kiswahili</option>
        <option value="fon">Fon</option>
    </select>
</header>

<main>

    <section>
        <h2 id="restaurantsTitle">Restaurants</h2>
        <div id="restaurants">Chargement...</div>
    </section>

    <section>
        <h2 id="hotelsTitle">Hôtels</h2>
        <div id="hotels">Chargement...</div>
    </section>

    <section>
        <h2 id="subscriptionTitle">Abonnement</h2>

        <div id="subscription">
            Chargement...
        </div>

        <div class="actions">
            <button class="primary" onclick="pay('monthly')">
                2 000 FCFA / mois
            </button>

            <button class="primary" onclick="pay('annual')">
                24 000 FCFA / an
            </button>
        </div>
    </section>

    <section>
        <h2 id="notificationsTitle">Notifications</h2>
        <div id="notifications">Chargement...</div>
    </section>

    <section>
        <button class="logout" onclick="logout()">
            Déconnexion
        </button>

        <p id="message"></p>
    </section>

</main>

<script>
const API = "/api";

const translations = {
    fr: {
        restaurants: "Restaurants",
        hotels: "Hôtels",
        subscription: "Abonnement",
        notifications: "Notifications",
        trial: "Essai gratuit",
        active: "Actif",
        expired: "Expiré",
        suspended: "Suspendu",
        follow: "Suivre l'itinéraire",
        stop: "Arrêter le suivi",
        location: "Localisation",
        distance: "Distance",
        payment: "Paiement",
        logout: "Déconnexion",
        noEstablishments: "Aucun établissement disponible.",
        noNotifications: "Aucune notification.",
        followStarted: "Suivi démarré.",
        followStopped: "Suivi arrêté."
    },

    en: {
        restaurants: "Restaurants",
        hotels: "Hotels",
        subscription: "Subscription",
        notifications: "Notifications",
        trial: "Free trial",
        active: "Active",
        expired: "Expired",
        suspended: "Suspended",
        follow: "Follow route",
        stop: "Stop following",
        location: "Location",
        distance: "Distance",
        payment: "Payment",
        logout: "Logout",
        noEstablishments: "No establishment available.",
        noNotifications: "No notifications.",
        followStarted: "Following started.",
        followStopped: "Following stopped."
    }
};

function token() {
    return localStorage.getItem("mrh_token");
}

function authHeaders() {
    return {
        "Authorization": "Bearer " + token(),
        "Content-Type": "application/json"
    };
}

async function api(path, options = {}) {

    const response = await fetch(API + path, {
        ...options,
        headers: {
            ...authHeaders(),
            ...(options.headers || {})
        }
    });

    const data = await response.json();

    if (response.status === 401 || response.status === 403) {
        throw new Error(data.detail || "Accès refusé.");
    }

    if (!response.ok) {
        throw new Error(data.detail || "Erreur serveur.");
    }

    return data;
}

function t(key) {
    const lang = document.getElementById("language").value;

    return (
        translations[lang]?.[key] ||
        translations.fr[key] ||
        key
    );
}

function safe(value) {
    return value === null || value === undefined
        ? ""
        : String(value);
}

function distanceKm(lat1, lon1, lat2, lon2) {

    if (
        lat1 === null ||
        lon1 === null ||
        lat2 === null ||
        lon2 === null
    ) {
        return null;
    }

    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

async function loadEstablishments() {

    const data = await api("/establishments/public");
    const establishments = Array.isArray(data) ? data : (data.establishments || []);

    const restaurants = establishments.filter(
        e => e.category === "restaurant"
    );

    const hotels = establishments.filter(
        e => e.category === "hotel"
    );

    renderEstablishments(
        "restaurants",
        restaurants
    );

    renderEstablishments(
        "hotels",
        hotels
    );
}

function renderEstablishments(elementId, establishments) {

    const box = document.getElementById(elementId);

    if (!establishments.length) {
        box.innerHTML =
            `<p class="empty">${t("noEstablishments")}</p>`;
        return;
    }

    box.innerHTML = establishments.map(e => {

        const lat = e.latitude;
        const lon = e.longitude;

        return `
            <div class="item" data-lat="${safe(lat)}" data-lon="${safe(lon)}">
                <strong>${safe(e.name)}</strong>

                <p>
                    ${safe(e.description)}
                </p>

                <p>
                    ${t("location")} :
                    ${safe(lat)}, ${safe(lon)}
                </p>

                <p>
                    ${t("distance")} : <strong class="distance-value">--</strong>
                </p>

                <div class="actions">

                    <button
                        class="primary"
                        onclick="startFollow(${e.id})">
                        ${t("follow")}
                    </button>

                    <button
                        class="stop"
                        onclick="stopFollow(${e.id})">
                        ${t("stop")}
                    </button>

                </div>
            </div>
        `;
    }).join("");
}

async function loadSubscription() {

    const box = document.getElementById("subscription");

    try {

        const data = await api("/auth/subscription");

        if (!data.subscription) {
            box.innerHTML =
                `<p class="empty">Aucun abonnement.</p>`;
            return;
        }

        const s = data.subscription;

        box.innerHTML = `
            <div class="item">
                <p>
                    <strong>Statut :</strong>
                    <span class="status">
                        ${safe(s.status)}
                    </span>
                </p>

                <p>
                    <strong>Plan :</strong>
                    ${safe(s.plan)}
                </p>

                <p>
                    <strong>Expiration :</strong>
                    ${safe(s.expires_at)}
                </p>
            </div>
        `;

    } catch (error) {
        box.innerHTML =
            `<p class="error">${safe(error.message)}</p>`;
    }
}

async function loadNotifications() {

    const box = document.getElementById("notifications");

    try {

        const data = await api("/auth/notifications");

        if (!data.notifications.length) {
            box.innerHTML =
                `<p class="empty">${t("noNotifications")}</p>`;
            return;
        }

        box.innerHTML = data.notifications.map(n => `
            <div class="item">
                <strong>${safe(n.type)}</strong>
                <p>${safe(n.message)}</p>
                <small>${safe(n.created_at)}</small>
            </div>
        `).join("");

    } catch (error) {
        box.innerHTML =
            `<p class="error">${safe(error.message)}</p>`;
    }
}

let currentPosition = null;
let gpsWatchId = null;

function startGps() {
    if (!navigator.geolocation) {
        showMessage("La géolocalisation n'est pas disponible sur cet appareil.");
        return;
    }

    if (gpsWatchId !== null) {
        return;
    }

    gpsWatchId = navigator.geolocation.watchPosition(
        position => {
            currentPosition = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };

            updateDistances();
        },
        error => {
            console.warn("GPS:", error.message);
            showMessage("Autorise la localisation pour calculer la distance.");
        },
        {
            enableHighAccuracy: true,
            maximumAge: 10000,
            timeout: 15000
        }
    );
}

function stopGps() {
    if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
    }
}

function updateDistances() {
    if (!currentPosition) {
        return;
    }

    document.querySelectorAll("[data-lat][data-lon]").forEach(card => {
        const lat = Number(card.dataset.lat);
        const lon = Number(card.dataset.lon);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
            return;
        }

        const distance = distanceKm(
            currentPosition.latitude,
            currentPosition.longitude,
            lat,
            lon
        );

        const target = card.querySelector(".distance-value");

        if (target && distance !== null) {
            target.textContent = distance.toFixed(2) + " km";
        }
    });
}

async function startFollow(establishmentId) {
    try {
        startGps();

        await api("/follow/start", {
            method: "POST",
            body: JSON.stringify({
                establishment_id: establishmentId
            })
        });

        showMessage(t("followStarted"));
        await loadNotifications();

    } catch (error) {
        showMessage(error.message);
    }
}

async function stopFollow(establishmentId) {
    try {
        await api("/follow/stop", {
            method: "POST",
            body: JSON.stringify({
                establishment_id: establishmentId
            })
        });

        stopGps();

        showMessage(t("followStopped"));
        await loadNotifications();

    } catch (error) {
        showMessage(error.message);
    }
}

async function pay(period) {

    try {

        const data = await api("/payments/create", {
            method: "POST",
            body: JSON.stringify({
                period: period
            })
        });

        showMessage(
            "Demande de paiement créée : " +
            data.payment.reference
        );

    } catch (error) {
        showMessage(error.message);
    }
}

async function changeLanguage(language) {

    try {

        await api(
            "/languages/me?language=" +
            encodeURIComponent(language),
            {
                method: "PUT"
            }
        );

    } catch (error) {
        showMessage(error.message);
    }

    applyTranslations();

    await loadEstablishments();
    await loadNotifications();
}

function applyTranslations() {

    document.getElementById("restaurantsTitle").textContent =
        t("restaurants");

    document.getElementById("hotelsTitle").textContent =
        t("hotels");

    document.getElementById("subscriptionTitle").textContent =
        t("subscription");

    document.getElementById("notificationsTitle").textContent =
        t("notifications");
}

function showMessage(message) {

    const box = document.getElementById("message");

    box.textContent = safe(message);
    box.className = "success";
}

function logout() {

    localStorage.removeItem("mrh_token");

    window.location.href = "login.html";
}

async function loadAll() {

    if (!token()) {
        window.location.href = "login.html";
        return;
    }

    try {

        await loadEstablishments();
        await loadSubscription();
        await loadNotifications();

    } catch (error) {

        showMessage(error.message);
    }
}

document
    .getElementById("language")
    .addEventListener("change", event => {
        changeLanguage(event.target.value);
    });

loadAll();
</script>


<script id="mrh-brand-script">
document.addEventListener("DOMContentLoaded",function(){

  const candidates=document.querySelectorAll(
    ".brand,.logo,.app-logo,.navbar-brand,.header-brand"
  );

  candidates.forEach(function(el){

    if(el.querySelector(".mrh-logo")) return;

    const img=document.createElement("img");

    img.src="assets/mrh-logo.svg";
    img.alt="Monogramme MRH";
    img.className="mrh-logo";

    el.prepend(img);
    el.classList.add("mrh-brand");
  });

});
</script>

</body>
</html>
